<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>SnapCook</title>   
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            #start {
                display: block; /* 배경색과 패딩이 제대로 적용되도록 설정 */
                text-align: center;
                text-decoration: none;
                font-size: 50px;
                font-weight: bold;     /* h2 대신 글자를 굵게 처리 */
                color: #2b5797;
                padding: 10px 20px;    /* 버튼 느낌이 나도록 여백 추가 */
                border-radius: 8px;    /* 모서리 라운딩 (선택) */
                transition: all 0.2s ease;
                margin-top: 20px;
                width: 400px;          /* 버튼의 너비 지정 */
                margin: 20px auto 0;
            }
            
            #start:hover {
                background-color: #2b5797;
                color: #eee;
            }
        </style>
    </head>
    <body>
        <div>
            <div>
                <div style="font-size: 40px; padding-bottom: 10px;">SnapCook</div>
                <header>
                    <div>
                        <nav>
                        </nav>
                    </div>
                </header>
            </div>
            <div>
                <a id="start" href="/main">
                    SnapCook 시작!
                </a>
            </div>
        </div>
    </body>
</html>
