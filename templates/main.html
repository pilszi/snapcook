<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCook</title>   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 중앙 정렬 및 여백 주기 */
        html, body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* 가로 스크롤/짤림 완벽 방지 */
            box-sizing: border-box;
            font-family: sans-serif;
        }
        /* 요소들이 화면 너비를 넘지 않도록 설정 */
        video, img, button {
            max-width: 500px;
            box-sizing: border-box;
            margin: 10px auto;
            display: block;
        }
        button {
            padding: 15px; 
            font-size: 15px; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            margin: 10px auto;
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>
    <div>
        <div>
            <div style="font-size: 40px; padding-bottom: 10px; text-align: center;">&nbsp;SnapCook</div>
            <header>
                <div>
                    <nav>
                        <div class="nav-container">
                            <a href="/" class="nav_link">Home</a>
                            {% if filename %}
                            <a href="#" class="nav_link" onclick="goDetect()">Detection</a>
                            {% endif %}
                        </div>
                    </nav>
                </div>
            </header>
        </div>
        <div>
            <div id="det_item">
                <video id="webcam" autoplay playsinline width="400" height="300" style="border: 1px solid #ccc;"></video>
                <br><br>
                <button type="button" onclick="captureAndUpload()">📸 사진 촬영 및 저장</button>
            </div>
            <p id="status" style="text-align: center;"></p>
            <div id="detect">
            </div>
        </div>
    </div>
</body>
<script>
    // 변수 선언
    let filename = '';
    let detect_class = ''
    const det_item = document.getElementById('det_item');
    const detect_area = document.getElementById('detect');
    let video = ''

    function webCamStart(){
        video = document.getElementById('webcam');
    
        // 1. 브라우저 웹캠 키기
        const constraints = {
            video: {
                // 'user': 전면 카메라
                // 'environment': 후면 카메라
                facingMode: { ideal: 'environment' } // 후면 카메라를 가장 선호함
            }
        };
            
        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("웹캠 접근 실패:", err); });
    }


    // 2. 캡처 및 Flask 전송
    async function captureAndUpload() {

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 캔버스에 현재 영상 프레임 그리기
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        // 캔버스 화면을 Blob 파일로 변환
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'webcam_frame.jpg');

            document.getElementById('status').innerText = "저장 중...";

            // Flask 서버로 파일 전송
            const res = await fetch('/save_img', {  
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data){
                filename= data.filename;
                det_item.innerHTML = `
                    <img src="{{ url_for('static', filename='/upload/') }}${filename}" width="200" height="300" style="border: 1px solid #ccc;">
                    <br><br>
                    <button onclick="reCapture()">재촬영</button>
                    <button onclick="detection(filename)">탐지 시작</button>
                `;
                document.getElementById('status').innerText = `✅ 저장 완료: ${filename}`;
            };
        }, 'image/jpeg');
    }

    async function detection(filename){
        console.log(filename);
        const formData = new FormData();
        formData.append('file', filename);
        // Flask 서버로 파일 전송
        document.getElementById('status').innerText = "탐지 중...";
        const res = await fetch('/yolo/detection', {  
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ file: filename })
        });

        const data = await res.json();
        console.log(data);
        detect_class = data.detect;
        det_item.innerHTML = `
            <img src="{{ url_for('static', filename=('/result/res_')) }}${filename}" width="200" height="300" style="border: 1px solid #ccc;">
            <br><br>
            <button onclick="reCapture()">재촬영</button>
            <form action="/detect" method="POST">
                <input type="hidden" name="cls" value="${data.detect}">
                <input type="hidden" name="file" value="${filename}">
                <button type="submit">레시피 추천</button>
            </form>
        `;
        document.getElementById('status').innerHTML = data.detect;
    }

    function reCapture(){
        det_item.innerHTML = `
            <video id="webcam" autoplay playsinline width="400" height="300" style="border: 1px solid #ccc;"></video>
            <br><br>
            <button type="button" onclick="captureAndUpload()">📸 사진 촬영 및 저장</button>
        `;
        webCamStart();
    }

    // DOM 로드 시 실행
    document.addEventListener('DOMContentLoaded', webCamStart);
</script>
</html>
