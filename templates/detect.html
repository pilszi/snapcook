<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SnapCook_datail</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            /* 중앙 정렬 및 여백 주기 */
            html, body {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden; /* 가로 스크롤/짤림 완벽 방지 */
                box-sizing: border-box;
                font-family: sans-serif;
            }
        </style>
    </head>
    <body>
        <div>
            <div>
                <div style="font-size: 40px; padding-bottom: 10px; text-align: center;">&nbsp;SnapCook</div>
                <header>
                    <div>
                        <nav>
                            <div class="nav-container">
                                <a href="/" class="nav_link">Home</a>
                                {% if filename %}
                                <a href="#" class="nav_link" onclick="goDetect()">Detection</a>
                                {% endif %}
                            </div>
                        </nav>
                    </div>
                </header>
            </div>
            <div>
                <p id="length" style="font-size: 20px;"></p>
                <div id="detect">
                </div>
            </div>
        </div>
    </body>
    <script>
        // 변수 선언
        const detect_class = {{ detect | tojson }};
        console.log(detect_class);
        const filename = {{ filename | tojson }};
        console.log(filename);
        const detect_area = document.getElementById('detect');
        let allTitles = [], allImgs = [], allIds = [];
        let currentIndex = 0;       // 현재까지 화면에 노출된 항목 수
        const ITEMS_PER_PAGE = 10;  // 한 번에 불러올 개수
        let isLoading = false;       // 스크롤 중복 호출 방지 플래그

        async function snapcook() {
            try {
                const response = await fetch('/api/snapcook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({class: detect_class})
                });
                const data = await response.json();
                console.log(data);

                allTitles = data.result[0] || [];
                allImgs = data.result[1] || [];
                allIds = data.result[2] || [];

                document.getElementById('length').innerHTML = `&nbsp;&nbsp;총 ${allIds.length}개의 레시피`;
                detect_area.innerHTML = '';
                currentIndex = 0;

                // 처음 15개 렌더링
                renderNextBatch();

                // 스크롤 이벤트 등록
                window.addEventListener('scroll', handleScroll);
            } catch (error) {
                console.error('데이터를 불러오는 중 오류 발생:', error);
            }
        }

        // 15개씩 받아와서 화면에 추가(append)하는 함수
        function renderNextBatch() {
            if (currentIndex >= allTitles.length) return;

            const nextIndex = currentIndex + ITEMS_PER_PAGE;
            const sliceTitles = allTitles.slice(currentIndex, nextIndex);

            const html = sliceTitles.map((title, i) => {
                const actualIndex = currentIndex + i;
                const img = allImgs[actualIndex];
                const id = allIds[actualIndex];

                return `
                    <a href="/recipe/detail?id=${id}&file=${filename}&cls=${detect_class}" class="hover-row">
                        <div class="menu-item">
                            <img src="${img}" alt="${title}">
                            <div>
                                <h4 style="margin: 0 0 5px 0;">${title}</h4>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            // 기존 내역 지우지 않고 하단에 덧붙이기
            detect_area.insertAdjacentHTML('beforeend', html);
            currentIndex = nextIndex;
            isLoading = false;
        }

        // 스크롤 감지 함수
        function handleScroll() {
            if (isLoading) return;

            // 페이지 맨 아래 근처(100px 전)까지 스크롤했는지 확인
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollTop + windowHeight >= documentHeight - 100) {
                if (currentIndex < allTitles.length) {
                    isLoading = true;
                    renderNextBatch();
                }
            }
        }

        function goDetect(){
            cls = detect_class;
            file = filename;
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/detect';

            // cls 파라미터 추가
            const inputCls = document.createElement('input');
            inputCls.type = 'hidden';
            inputCls.name = 'cls';
            inputCls.value = cls;
            form.appendChild(inputCls);

            // file 파라미터 추가
            const inputFile = document.createElement('input');
            inputFile.type = 'hidden';
            inputFile.name = 'file';
            inputFile.value = file;
            form.appendChild(inputFile);

            // 폼 제출
            document.body.appendChild(form);
            form.submit();
        }

        // DOM 로드 시 실행
        if (detect_class && detect_class.length > 0) {
            document.addEventListener('DOMContentLoaded', snapcook);
        }
    </script>
</html>
