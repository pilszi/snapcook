<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SnapCook_datail</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            /* 중앙 정렬 및 여백 주기 */
            html, body {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden; /* 가로 스크롤/짤림 완벽 방지 */
                box-sizing: border-box;
                font-family: sans-serif;
            }

            #align_btn button {
                padding: 15px; 
                font-size: 15px; 
                font-weight: bold;
                border: none; 
                border-radius: 8px; 
                margin: 10px auto;
                cursor: pointer;
                display: inline-block;
            }

            #align_btn button:hover {
                background-color: #2b5797;
                color: #eee;
            }

            #align_btn {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div>
            <div>
                <div style="font-size: 40px; padding-bottom: 10px; text-align: center;">&nbsp;SnapCook</div>
                <header>
                    <div>
                        <nav>
                            <div class="nav-container">
                                <a href="/" class="nav_link">Home</a>
                                {% if filename %}
                                <a href="#" class="nav_link" onclick="goDetect()">Detection</a>
                                {% endif %}
                            </div>
                        </nav>
                    </div>
                </header>
            </div>
            <div id="align_btn">
                <button onclick="align('all')">전체보기</button>
                <button onclick="align('1')" name="초급">초급</button>
                <button onclick="align('2')" name="중급">중급</button>
                <button onclick="align('3')" name="고급">고급</button>
            </div>
            <div>
                <p id="length" style="font-size: 20px;"></p>
                <div id="detect">
                </div>
            </div>
        </div>
    </body>
    <script>
        // 변수 선언
        const detect_class = {{ detect | tojson }};
        console.log(detect_class);
        const filename = {{ filename | tojson }};
        console.log(filename);
        const detect_area = document.getElementById('detect');
        let all_titles = [], all_imgs = [], all_ids = []; all_levels = [];
        let currentIndex = 0;       // 현재까지 화면에 노출된 항목 수
        const ITEMS_PER_PAGE = 10;  // 한 번에 불러올 개수
        let isLoading = false;       // 스크롤 중복 호출 방지 플래그
        let currentLevelFilter = 'all';
        let filteredIndices = [];  


        async function snapcook() {
            try {
                const response = await fetch('/api/snapcook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({class: detect_class})
                });
                const data = await response.json();
                console.log(data);

                all_titles = data.result[0] || [];
                all_imgs = data.result[1] || [];
                all_ids = data.result[2] || [];
                all_levels = data.result[3] || [];
                // console.log(all_levels);

                document.getElementById('length').innerHTML = `&nbsp;&nbsp;총 ${all_ids.length}개의 레시피`;
                detect_area.innerHTML = '';
                currentIndex = 0;

                // 처음 15개 렌더링
                align('all')
                // renderNextBatch();

                // 스크롤 이벤트 등록
                window.addEventListener('scroll', handleScroll);
            } catch (error) {
                console.error('데이터를 불러오는 중 오류 발생:', error);
            }
        }

        // 15개씩 받아와서 화면에 추가(append)하는 함수
        function renderNextBatch() {
            if (currentIndex >= filteredIndices.length) {
                console.log("더 이상 렌더링할 데이터가 없습니다.");
                return;}

            const nextIndex = currentIndex + ITEMS_PER_PAGE;
            
            // 1. 변수명 통일 (sliceIndices)
            const sliceIndices = filteredIndices.slice(currentIndex, nextIndex);
            
            const html = sliceIndices.map(actualIndex => {
                const title = all_titles[actualIndex];
                const img = all_imgs[actualIndex];
                const id = all_ids[actualIndex];
                const level = all_levels[actualIndex];
                let lvl = '';
                if (String(level) === '1') lvl = '초급';
                else if (String(level) === '2') lvl = '중급';
                else lvl = '고급';

                return `
                    <a href="/recipe/detail?id=${id}&file=${filename}&cls=${detect_class}" class="hover-row">
                        <div class="menu-item">
                            <img src="${img}" alt="${title}">
                            <div>
                                <h4 style="margin: 0 0 5px 0;">${title}</h4>
                                <span>난이도: ${lvl}</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            // 기존 내역 지우지 않고 하단에 덧붙이기
            detect_area.insertAdjacentHTML('beforeend', html);
            currentIndex = nextIndex;
            isLoading = false;
        }

        // 스크롤 감지 함수
        function handleScroll() {
            if (isLoading) return;

            // 페이지 맨 아래 근처(100px 전)까지 스크롤했는지 확인
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollTop + windowHeight >= documentHeight - 100) {
                if (currentIndex < all_titles.length) {
                    isLoading = true;
                    renderNextBatch();
                }
            }
        }

        function goDetect(){
            cls = detect_class;
            file = filename;
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/detect';

            // cls 파라미터 추가
            const inputCls = document.createElement('input');
            inputCls.type = 'hidden';
            inputCls.name = 'cls';
            inputCls.value = cls;
            form.appendChild(inputCls);

            // file 파라미터 추가
            const inputFile = document.createElement('input');
            inputFile.type = 'hidden';
            inputFile.name = 'file';
            inputFile.value = file;
            form.appendChild(inputFile);

            // 폼 제출
            document.body.appendChild(form);
            form.submit();
        }

        function align(lvl) {
            currentLevelFilter = lvl; // 현재 필터 상태 저장
            
            // 원본 데이터(all_levels)에서 선택한 난이도에 해당하는 인덱스만 추출
            filteredIndices = [];
            all_levels.forEach((level, idx) => {
                if (lvl === 'all' || String(level) === String(lvl)) {
                    filteredIndices.push(idx);
                }
            });

            console.log("필터링된 데이터 개수:", filteredIndices.length);
            // 화면 및 인덱스 초기화 후 첫 번째 배치 렌더링
            detect_area.innerHTML = '';
            currentIndex = 0;
            renderNextBatch();
        }

        // DOM 로드 시 실행
        if (detect_class && detect_class.length > 0) {
            document.addEventListener('DOMContentLoaded', snapcook);
        }
    </script>
</html>
